[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadatagenerator"
version = "0.1.0"
description = "Context-grounded, lineage-aware automatic description generation for data-catalog metadata."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenMetaDataGenerator Authors" }]
keywords = ["metadata", "data-catalog", "llm", "data-documentation", "lineage"]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
# Metadata sources
datahub   = ["requests>=2.28"]
databricks = ["databricks-sql-connector>=3.0"]
snowflake = ["snowflake-connector-python>=3.0"]
# LLM backends (install only what you use)
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
bedrock   = ["boto3>=1.34"]
vertex    = ["google-cloud-aiplatform>=1.60"]
azure     = ["openai>=1.0"]
gemini    = ["google-genai>=0.3"]
# Semantic retrieval (HNSW) + local knowledge store
embed     = ["sentence-transformers>=2.2", "hnswlib>=0.7"]
store     = ["duckdb>=0.9"]
all = [
    "requests>=2.28", "openai>=1.0", "anthropic>=0.34",
    "boto3>=1.34", "google-genai>=0.3",
    "sentence-transformers>=2.2", "hnswlib>=0.7", "duckdb>=0.9",
]

[project.scripts]
omdg = "openmetadatagenerator.cli:main"

[tool.setuptools.packages.find]
include = ["openmetadatagenerator*", "benchmark*"]
