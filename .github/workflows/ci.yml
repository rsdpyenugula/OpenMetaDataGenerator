name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base + duckdb for the store; no heavy ML deps in CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest duckdb

      - name: Unit tests
        run: python -m pytest -q tests/

      - name: Reproduce benchmark ablations (deterministic backend, no API keys)
        run: |
          python -m benchmark.run --benchmark synthetic
          python -m benchmark.run --benchmark tpch

      - name: Check generated result tables are non-empty
        run: |
          test -s paper/results_table.tex
          test -s paper/results_table_tpch.tex

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff
      - name: Ruff (syntax + basic checks)
        run: ruff check openmetadatagenerator benchmark --select E9,F63,F7,F82
